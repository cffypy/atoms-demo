name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 Actions 部署到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 把仓库 Secret（DEEPSEEK_KEY）注入到 secrets.js —— 该文件不会进入源码仓库
      - name: Inject DeepSeek API key (from repo secret, NOT committed)
        run: |
          printf 'window.ATOMS_SECRETS={apiKey:%s};' "'${{ secrets.DEEPSEEK_KEY }}'" > assets/js/secrets.js
          echo "secrets.js injected ($(wc -c < assets/js/secrets.js) bytes)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
